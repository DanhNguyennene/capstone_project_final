<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slurm Agent — Evaluation Dashboard</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --red: #f85149; --yellow: #d29922; --purple: #bc8cff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
  background: var(--bg); color: var(--text); min-height: 100vh; }

/* Layout */
.app { display: flex; height: 100vh; }
.sidebar { width: 340px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; }
.main { flex: 1; overflow-y: auto; padding: 24px; }

/* Header */
.header { padding: 16px; border-bottom: 1px solid var(--border); }
.header h1 { font-size: 16px; color: var(--accent); margin-bottom: 8px; }
.header .stats { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.header .stats span { background: var(--bg); padding: 2px 8px; border-radius: 4px; }

/* Controls */
.controls { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.controls .row { display: flex; gap: 6px; align-items: center; }
.controls .model-row { display: grid; grid-template-columns: 96px 1fr 1fr; gap: 6px; align-items: center; }
.controls .model-row span { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
.controls select, .controls input[type=text] {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 4px 8px; border-radius: 4px; font-size: 12px; flex: 1; }
.controls label { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
.controls input[type=checkbox] { accent-color: var(--accent); }
.btn { background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; transition: .15s; }
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.secondary { background: var(--border); }
.btn.sm { padding: 3px 8px; font-size: 11px; }
.btn.green { background: var(--green); }
.btn.red { background: var(--red); }

/* Test list */
.test-list { flex: 1; overflow-y: auto; }
.test-item { padding: 8px 12px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: .1s; display: flex; align-items: center; gap: 8px; }
.test-item:hover { background: rgba(88,166,255,.08); }
.test-item.active { background: rgba(88,166,255,.15); border-left: 3px solid var(--accent); }
.test-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot.untested { background: var(--border); }
.dot.running { background: var(--yellow); animation: pulse 1s infinite; }
.dot.passed { background: var(--green); }
.dot.failed { background: var(--red); }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
.test-item .info { flex: 1; min-width: 0; }
.test-item .tid { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.test-item .meta { font-size: 10px; color: var(--muted); }
.test-item .score { font-size: 12px; font-weight: 700; min-width: 36px; text-align: right; }
.test-item .variant-tag { font-size: 9px; background: var(--border); padding: 1px 4px; border-radius: 3px; color: var(--muted); }

/* Filters */
.filters { padding: 8px 12px; border-bottom: 1px solid var(--border);
  display: flex; gap: 4px; flex-wrap: wrap; }
.filter-chip { font-size: 10px; padding: 2px 8px; border-radius: 12px;
  cursor: pointer; border: 1px solid var(--border); color: var(--muted); transition: .15s; }
.filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,.1); }

/* Progress bar */
.progress-bar { height: 3px; background: var(--border); }
.progress-bar .fill { height: 100%; background: var(--accent); transition: width .3s; }

/* Detail view */
.detail { max-width: 900px; }
.detail h2 { font-size: 20px; margin-bottom: 4px; }
.detail .prompt-text { font-size: 14px; color: var(--muted); margin-bottom: 16px;
  background: var(--surface); padding: 12px; border-radius: 8px; border-left: 3px solid var(--accent); }
.section { margin-bottom: 20px; }
.section h3 { font-size: 13px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 8px; }

/* Score cards */
.score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.score-card { background: var(--surface); padding: 12px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
.score-card .val { font-size: 24px; font-weight: 700; }
.score-card .label { font-size: 10px; color: var(--muted); margin-top: 2px; }
.score-card.pass { border-color: var(--green); }
.score-card.fail { border-color: var(--red); }

/* GT vs Agent comparison */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.compare-col { background: var(--surface); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
.compare-col h4 { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
.compare-col .field { margin-bottom: 6px; }
.compare-col .field-label { font-size: 10px; color: var(--muted); }
.compare-col .field-value { font-size: 13px; }
.match { color: var(--green); }
.mismatch { color: var(--red); }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px;
  margin: 1px; background: rgba(88,166,255,.15); color: var(--accent); }
.tag.miss { background: rgba(248,81,73,.15); color: var(--red); }

/* Response */
.response-box { background: var(--surface); padding: 12px; border-radius: 8px;
  border: 1px solid var(--border); font-size: 13px; line-height: 1.5;
  max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }

/* Judge */
.judge-box { background: var(--surface); padding: 12px; border-radius: 8px;
  border: 1px solid var(--purple); }
.judge-box .judge-score { font-size: 20px; font-weight: 700; color: var(--purple); }
.judge-box .judge-reason { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* Metrics panel */
.metrics-panel { background: var(--surface); padding: 16px; border-radius: 8px;
  border: 1px solid var(--border); margin-bottom: 20px; }
.metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
.metric { text-align: center; }
.metric .val { font-size: 22px; font-weight: 700; }
.metric .label { font-size: 10px; color: var(--muted); }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--muted); gap: 16px; }
.empty h2 { color: var(--text); }

/* Nav buttons */
.nav-row { display: flex; justify-content: space-between; margin-top: 16px; }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="header">
      <h1>⚡ Evaluation Dashboard</h1>
      <div class="stats">
        <span id="stat-total">0 tests</span>
        <span id="stat-passed" style="color:var(--green)">0 ✓</span>
        <span id="stat-failed" style="color:var(--red)">0 ✗</span>
        <span id="stat-untested">0 ○</span>
      </div>
    </div>

    <div class="controls">
      <div class="row">
        <button class="btn" id="btn-load" onclick="loadDefault()">Load Dataset</button>
        <label class="btn secondary" style="cursor:pointer">
          Upload <input type="file" accept=".json" style="display:none" onchange="uploadFile(this)">
        </label>
      </div>
      <div class="row">
        <input type="text" id="agent-url" value="http://localhost:8000" placeholder="Agent URL">
      </div>
      <div class="model-row">
        <span>Main</span>
        <select id="main-provider" onchange="syncModelSelects()"><option value="ollama">Ollama</option><option value="openai">OpenAI</option><option value="azure-openai">Azure OpenAI</option></select>
        <select id="main-model"></select>
      </div>
      <div class="model-row">
        <span>Specialist</span>
        <select id="specialist-provider" onchange="syncModelSelects()"><option value="ollama">Ollama</option><option value="openai">OpenAI</option><option value="azure-openai">Azure OpenAI</option></select>
        <select id="specialist-model"></select>
      </div>
      <div class="model-row">
        <span>Judge</span>
        <select id="judge-provider" onchange="syncModelSelects()"><option value="ollama">Ollama</option><option value="openai">OpenAI</option><option value="azure-openai">Azure OpenAI</option></select>
        <select id="judge-model"></select>
      </div>
      <div class="row">
        <label><input type="checkbox" id="chk-approve" checked> Auto-approve</label>
        <label><input type="checkbox" id="chk-judge"> LLM Judge</label>
        <label><input type="checkbox" id="chk-no-variants"> No variants</label>
        <label><input type="checkbox" id="chk-openai-parallel"> OpenAI read parallel</label>
        <label>Eval workers <input type="number" id="parallel-workers" min="1" max="8" value="1" style="width:56px"></label>
      </div>
      <div class="row">
        <button class="btn green" id="btn-run" onclick="runAll()" disabled>▶ Run All</button>
        <button class="btn red" id="btn-stop" onclick="stopEval()" disabled>■ Stop</button>
      </div>
    </div>

    <div class="filters" id="filters"></div>
    <div class="progress-bar"><div class="fill" id="progress-fill" style="width:0%"></div></div>
    <div class="test-list" id="test-list"></div>
  </div>

  <!-- Main -->
  <div class="main" id="main-content">
    <div class="empty" id="empty-state">
      <h2>Load a dataset to begin</h2>
      <p>Click "Load Dataset" to use the default dataset.json,<br>or upload your own.</p>
    </div>
    <div id="detail-view" style="display:none"></div>
    <div id="metrics-view" style="display:none"></div>
  </div>
</div>

<script>
const API = '';
let dataset = [];
let results = {};
let activeTestId = null;
let activeFilter = {scenario: '', category: '', status: ''};
let eventSource = null;

const OLLAMA_MODELS = ['qwen3.5:9b', 'qwen2.5:7b', 'qwen3.5:27b', 'gpt-oss:20b'];
const OPENAI_MODELS = ['gpt-4o', 'gpt-4o-mini', 'gpt-4.5-preview', 'gpt-4.1', 'gpt-4.1-mini', 'gpt-4.1-nano', 'o3', 'o3-mini', 'o3-pro', 'o4-mini', 'o1', 'o1-mini'];
const AZURE_OPENAI_MODELS = ['gpt-4o', 'gpt-4o-mini', 'gpt-4.1-mini', 'gpt-4.1'];

function providerModels(provider) {
  if (provider === 'openai') return OPENAI_MODELS;
  if (provider === 'azure-openai') return AZURE_OPENAI_MODELS;
  return OLLAMA_MODELS;
}
function normProvider(provider) {
  const normalized = String(provider || '').trim().toLowerCase();
  if (normalized === 'openai') return 'openai';
  if (normalized === 'azure' || normalized === 'azure_openai' || normalized === 'azure-openai') return 'azure-openai';
  return 'ollama';
}

function fillModelSelect(id, provider, selected) {
  const el = document.getElementById(id);
  const models = providerModels(provider);
  const current = selected || el.value;
  const value = selected ? selected : (models.includes(current) ? current : models[0]);
  const options = models.includes(value) ? models : [value, ...models];
  el.innerHTML = options.map(model => `<option value="${model}">${model}</option>`).join('');
  el.value = value;
}

function syncModelSelects() {
  const mainProvider = normProvider(document.getElementById('main-provider').value);
  const specialistProvider = normProvider(document.getElementById('specialist-provider').value);
  const judgeProvider = normProvider(document.getElementById('judge-provider').value);
  fillModelSelect('main-model', mainProvider);
  fillModelSelect('specialist-model', specialistProvider);
  fillModelSelect('judge-model', judgeProvider);
  const parallel = document.getElementById('chk-openai-parallel');
  parallel.disabled = mainProvider !== 'openai';
  if (parallel.disabled) parallel.checked = false;
}

function applyRuntimeConfig(config) {
  if (!config) return;
  const mainProvider = normProvider(config.main_provider || config.llm_provider);
  const specialistProvider = normProvider(config.specialist_provider || mainProvider);
  const judgeProvider = normProvider(config.judge_provider || mainProvider);
  document.getElementById('main-provider').value = mainProvider;
  document.getElementById('specialist-provider').value = specialistProvider;
  document.getElementById('judge-provider').value = judgeProvider;
  fillModelSelect('main-model', mainProvider, config.main_model);
  fillModelSelect('specialist-model', specialistProvider, config.specialist_model);
  fillModelSelect('judge-model', judgeProvider, config.judge_model);
  document.getElementById('chk-openai-parallel').checked = Boolean(config.openai_parallel && mainProvider === 'openai');
  document.getElementById('parallel-workers').value = Math.max(1, Math.min(8, Number(config.parallel_workers || 1)));
  syncModelSelects();
}

function addModelConfigParams(params) {
  const mainProvider = normProvider(document.getElementById('main-provider').value);
  const specialistProvider = normProvider(document.getElementById('specialist-provider').value);
  const judgeProvider = normProvider(document.getElementById('judge-provider').value);
  params.set('llm_provider', mainProvider);
  params.set('main_provider', mainProvider);
  params.set('specialist_provider', specialistProvider);
  params.set('judge_provider', judgeProvider);
  params.set('main_model', document.getElementById('main-model').value);
  params.set('specialist_model', document.getElementById('specialist-model').value);
  params.set('judge_model', document.getElementById('judge-model').value);
  params.set('openai_parallel', String(document.getElementById('chk-openai-parallel').checked && mainProvider === 'openai'));
  params.set('parallel_workers', String(Math.max(1, Math.min(8, Number(document.getElementById('parallel-workers').value || 1)))));
}

async function syncRuntimeConfig() {
  syncModelSelects();
  try {
    const r = await fetch(`${API}/api/runtime-config`);
    applyRuntimeConfig(await r.json());
  } catch {}
}

// ── API calls ──────────────────────────────────────────────────────────────

async function loadDefault() {
  const r = await fetch(`${API}/api/load-default-dataset`, {method:'POST'});
  const d = await r.json();
  if (d.ok) await refreshDataset();
}

async function uploadFile(input) {
  const file = input.files[0]; if (!file) return;
  const fd = new FormData(); fd.append('file', file);
  const r = await fetch(`${API}/api/upload-dataset`, {method:'POST', body: fd});
  const d = await r.json();
  if (d.ok) await refreshDataset();
  input.value = '';
}

async function refreshDataset() {
  const params = new URLSearchParams();
  if (activeFilter.scenario) params.set('scenario', activeFilter.scenario);
  if (activeFilter.category) params.set('category', activeFilter.category);
  if (document.getElementById('chk-no-variants').checked) params.set('no_variants', 'true');
  const r = await fetch(`${API}/api/dataset?${params}`);
  const d = await r.json();
  dataset = d.tests;
  renderTestList();
  renderFilters();
  updateStats();
  document.getElementById('btn-run').disabled = dataset.length === 0;
  document.getElementById('empty-state').style.display = dataset.length ? 'none' : 'flex';
}

async function loadTestDetail(testId) {
  activeTestId = testId;
  const r = await fetch(`${API}/api/test/${testId}`);
  const d = await r.json();
  renderDetail(d.test, d.result);
  document.querySelectorAll('.test-item').forEach(el =>
    el.classList.toggle('active', el.dataset.id === testId));
}

async function runSingle(testId) {
  const agentUrl = document.getElementById('agent-url').value;
  const approve = document.getElementById('chk-approve').checked;
  const judge = document.getElementById('chk-judge').checked;
  const params = new URLSearchParams({agent_url: agentUrl, auto_approve: approve, use_judge: judge});
  addModelConfigParams(params);
  const r = await fetch(`${API}/api/run-single/${testId}?${params}`, {method:'POST'});
  const d = await r.json();
  results[testId] = d.result;
  updateStats();
  renderTestList();
  if (activeTestId === testId) loadTestDetail(testId);
}

// ── Run all via SSE ────────────────────────────────────────────────────────

function runAll() {
  const agentUrl = document.getElementById('agent-url').value;
  const approve = document.getElementById('chk-approve').checked;
  const judge = document.getElementById('chk-judge').checked;
  const noVariants = document.getElementById('chk-no-variants').checked;
  const params = new URLSearchParams({
    agent_url: agentUrl, auto_approve: approve,
    use_judge: judge, no_variants: noVariants, resume: 'true',
  });
  addModelConfigParams(params);
  if (activeFilter.scenario) params.set('scenario', activeFilter.scenario);
  if (activeFilter.category) params.set('category', activeFilter.category);

  document.getElementById('btn-run').disabled = true;
  document.getElementById('btn-stop').disabled = false;

  eventSource = new EventSource(`${API}/api/run?${params}`);

  // POST workaround: EventSource is GET-only, so we trigger via fetch
  fetch(`${API}/api/run?${params}`, {method:'POST'}).then(async resp => {
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith('event: ')) {
          const evt = line.slice(7);
          continue;
        }
        if (line.startsWith('data: ')) {
          const evtLine = lines[lines.indexOf(line) - 1] || '';
          const evt = evtLine.startsWith('event: ') ? evtLine.slice(7) : '';
          try {
            const data = JSON.parse(line.slice(6));
            handleSSE(evt, data);
          } catch {}
        }
      }
    }
    onRunComplete();
  }).catch(() => onRunComplete());
}

let lastEvt = '';
function handleSSE(evt, data) {
  // SSE parsing: event line comes before data line
  // We buffer the event name
}

// Better SSE parser using fetch + ReadableStream
function runAll() {
  const agentUrl = document.getElementById('agent-url').value;
  const approve = document.getElementById('chk-approve').checked;
  const judge = document.getElementById('chk-judge').checked;
  const noVariants = document.getElementById('chk-no-variants').checked;
  const params = new URLSearchParams({
    agent_url: agentUrl, auto_approve: approve,
    use_judge: judge, no_variants: noVariants, resume: 'true',
  });
  addModelConfigParams(params);
  if (activeFilter.scenario) params.set('scenario', activeFilter.scenario);
  if (activeFilter.category) params.set('category', activeFilter.category);

  document.getElementById('btn-run').disabled = true;
  document.getElementById('btn-stop').disabled = false;

  fetch(`${API}/api/run?${params}`, {method: 'POST'}).then(async resp => {
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});

      // Parse SSE frames: "event: X\ndata: {...}\n\n"
      while (true) {
        const endIdx = buf.indexOf('\n\n');
        if (endIdx === -1) break;
        const frame = buf.slice(0, endIdx);
        buf = buf.slice(endIdx + 2);

        let evtName = '', evtData = '';
        for (const ln of frame.split('\n')) {
          if (ln.startsWith('event: ')) evtName = ln.slice(7);
          else if (ln.startsWith('data: ')) evtData = ln.slice(6);
        }
        if (!evtData) continue;
        try {
          const data = JSON.parse(evtData);
          onSSE(evtName, data);
        } catch {}
      }
    }
    onRunComplete();
  }).catch(e => { console.error(e); onRunComplete(); });
}

function onSSE(evt, data) {
  if (evt === 'start') {
    applyRuntimeConfig(data.model_config);
    const total = Number(data.total || dataset.length || 1);
    const done = Number(data.already_done || 0);
    const pct = ((done / total) * 100).toFixed(0);
    document.getElementById('progress-fill').style.width = pct + '%';
  }
  else if (evt === 'test_start') {
    // Mark running in sidebar
    const el = document.querySelector(`.test-item[data-id="${data.id}"]`);
    if (el) {
      el.querySelector('.dot').className = 'dot running';
      el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    }
    const pct = ((data.index) / dataset.length * 100).toFixed(0);
    document.getElementById('progress-fill').style.width = pct + '%';
  }
  else if (evt === 'test_done') {
    results[data.id] = data.result;
    const el = document.querySelector(`.test-item[data-id="${data.id}"]`);
    if (el) {
      const passed = data.result.passed;
      el.querySelector('.dot').className = 'dot ' + (passed ? 'passed' : 'failed');
      el.querySelector('.score').textContent = pct(data.result.overall);
      el.querySelector('.score').style.color = passed ? 'var(--green)' : 'var(--red)';
    }
    updateStats();
    // Auto-navigate to current test
    if (activeTestId === data.id) loadTestDetail(data.id);
    const pctW = ((data.index + 1) / dataset.length * 100).toFixed(0);
    document.getElementById('progress-fill').style.width = pctW + '%';
  }
  else if (evt === 'complete') {
    document.getElementById('progress-fill').style.width = '100%';
    renderMetrics(data.metrics);
  }
}

function onRunComplete() {
  document.getElementById('btn-run').disabled = false;
  document.getElementById('btn-stop').disabled = true;
}

function stopEval() {
  fetch(`${API}/api/stop`, {method: 'POST'}).finally(() => onRunComplete());
}

// ── Rendering ──────────────────────────────────────────────────────────────

function pct(v) { return Math.round(v * 100) + '%'; }
function isPlaceholderJudgeReason(text) {
  const t = (text || '').trim();
  if (!t) return true;
  if (t === '...' || t === '…' || t === '-' || t === '--') return true;
  const squashed = t.replace(/[\s.,;:\-_!?/\\]+/g, '').toLowerCase();
  if (['na', 'none', 'null', 'tbd', 'unknown', 'noreason'].includes(squashed)) return true;
  return squashed.length < 10;
}
function chk(v) { return v >= 1.0 ? '✓' : '✗'; }

const TOOL_ALIASES = {
  sacctmgr_list: 'sacctmgr_show',
  sacctmgr: 'sacctmgr_show',
  scontrol: 'scontrol_show',
};
const TOOL_EQUIVALENTS = {
  sacctmgr_show: ['sacctmgr_show', 'sacctmgr_list'],
  sacctmgr_list: ['sacctmgr_show', 'sacctmgr_list'],
};

function uniq(values) {
  return [...new Set((values || []).filter(Boolean))];
}

function normalizeToolName(tool) {
  return TOOL_ALIASES[tool] || tool;
}

function equivalentToolNames(tool, aliasMap = null) {
  const canonical = normalizeToolName(tool);
  if (aliasMap && aliasMap[canonical]?.length) return aliasMap[canonical];
  if (aliasMap && aliasMap[tool]?.length) return aliasMap[tool];
  return TOOL_EQUIVALENTS[canonical] || [canonical];
}

function acceptedToolSet(tools = [], aliasMap = null) {
  const accepted = new Set();
  for (const tool of tools || []) {
    for (const name of equivalentToolNames(tool, aliasMap)) accepted.add(name);
    accepted.add(normalizeToolName(tool));
  }
  return accepted;
}

function toolIsExpected(tool, expectedSet = null, aliasMap = null) {
  if (!expectedSet) return false;
  if (expectedSet.has(tool) || expectedSet.has(normalizeToolName(tool))) return true;
  return equivalentToolNames(tool, aliasMap).some(name =>
    expectedSet.has(name) || expectedSet.has(normalizeToolName(name))
  );
}

function renderToolTags(tools = [], aliasMap = null, expectedSet = null) {
  const canonicalTools = uniq((tools || []).map(normalizeToolName));
  return canonicalTools.map(tool =>
    `<span class="tag ${expectedSet && !toolIsExpected(tool, expectedSet, aliasMap) ? 'miss' : ''}">${escHtml(equivalentToolNames(tool, aliasMap).join(' / '))}</span>`
  ).join('') || '<span style="color:var(--muted)">none</span>';
}

function renderTestList() {
  const list = document.getElementById('test-list');
  let filtered = dataset;
  if (activeFilter.status === 'passed') filtered = filtered.filter(t => results[t.id]?.passed === true);
  if (activeFilter.status === 'failed') filtered = filtered.filter(t => results[t.id]?.passed === false);
  if (activeFilter.status === 'untested') filtered = filtered.filter(t => !results[t.id]);

  list.innerHTML = filtered.map(t => {
    const r = results[t.id];
    let status = t.status;
    if (r) status = r.passed ? 'passed' : 'failed';
    const scoreText = r ? pct(r.overall) : '';
    const scoreColor = r ? (r.passed ? 'var(--green)' : 'var(--red)') : '';
    const variant = t.is_variant ? '<span class="variant-tag">v</span>' : '';
    return `<div class="test-item ${activeTestId === t.id ? 'active' : ''}"
      data-id="${t.id}" onclick="loadTestDetail('${t.id}')">
      <div class="dot ${status}"></div>
      <div class="info">
        <div class="tid">${t.id} ${variant}</div>
        <div class="meta">${t.category} · ${t.scenario}</div>
      </div>
      <div class="score" style="color:${scoreColor}">${scoreText}</div>
    </div>`;
  }).join('');
}

function renderFilters() {
  const scenarios = [...new Set(dataset.map(t => t.scenario))].sort();
  const categories = [...new Set(dataset.map(t => t.category))].sort();
  const statuses = ['passed', 'failed', 'untested'];
  const el = document.getElementById('filters');

  const chip = (type, val, label) => {
    const isActive = activeFilter[type] === val;
    return `<div class="filter-chip ${isActive ? 'active' : ''}"
      onclick="toggleFilter('${type}','${val}')">${label}</div>`;
  };

  el.innerHTML = [
    ...scenarios.map(s => chip('scenario', s, s)),
    '<br>',
    ...categories.map(c => chip('category', c, c)),
    '<br>',
    ...statuses.map(s => chip('status', s, s)),
  ].join('');
}

function toggleFilter(type, val) {
  activeFilter[type] = activeFilter[type] === val ? '' : val;
  refreshDataset();
}

function updateStats() {
  const total = dataset.length;
  const tested = dataset.filter(t => results[t.id]).length;
  const passed = dataset.filter(t => results[t.id]?.passed).length;
  const failed = tested - passed;
  document.getElementById('stat-total').textContent = `${total} tests`;
  document.getElementById('stat-passed').textContent = `${passed} ✓`;
  document.getElementById('stat-failed').textContent = `${failed} ✗`;
  document.getElementById('stat-untested').textContent = `${total - tested} ○`;
}

function renderDetail(test, result) {
  const dv = document.getElementById('detail-view');
  const mv = document.getElementById('metrics-view');
  dv.style.display = 'block';
  mv.style.display = 'none';
  document.getElementById('empty-state').style.display = 'none';

  const gt = test.ground_truth;
  const hasResult = !!result;

  // Score cards
  let scoreCards = '';
  if (hasResult) {
    const dims = [
      {key:'tool_recall', label:'Tool Recall', w: '30%'},
      {key:'routing_match', label:'Routing', w: '25%'},
      {key:'hitl_match', label:'HITL', w: '25%'},
      {key:'keyword_score', label:'Keywords', w: '10%'},
      {key:'state_match', label:'State', w: '10%'},
    ];
    if (result.judge_score > 0) dims.push({key:'judge_score', label:'Judge', w: '15%'});
    scoreCards = dims.map(d => {
      const v = result[d.key];
      const cls = v >= 0.99 ? 'pass' : v < 0.5 ? 'fail' : '';
      return `<div class="score-card ${cls}">
        <div class="val" style="color:${v >= 0.99 ? 'var(--green)' : v < 0.5 ? 'var(--red)' : 'var(--yellow)'}">${pct(v)}</div>
        <div class="label">${d.label} (${d.w})</div>
      </div>`;
    }).join('');

    scoreCards += `<div class="score-card ${result.passed ? 'pass' : 'fail'}">
      <div class="val" style="color:${result.passed ? 'var(--green)' : 'var(--red)'}">${pct(result.overall)}</div>
      <div class="label">Overall ${result.passed ? '✓ PASS' : '✗ FAIL'}</div>
    </div>`;
  }

  // GT vs Agent comparison
  let compareHtml = '';
  if (hasResult) {
    const expectedAliasMap = result.gt_tool_aliases || null;
    const expectedTools = result.gt_tools_canonical?.length ? result.gt_tools_canonical : (gt.tools || []);
    const expectedToolSet = acceptedToolSet(expectedTools, expectedAliasMap);
    const gtToolTags = renderToolTags(expectedTools, expectedAliasMap);
    const agentToolTags = renderToolTags(result.agent_tools || [], expectedAliasMap, expectedToolSet);

    compareHtml = `<div class="compare">
      <div class="compare-col">
        <h4>Ground Truth</h4>
        <div class="field"><div class="field-label">Tools</div><div class="field-value">${gtToolTags}</div></div>
        <div class="field"><div class="field-label">Handoff</div><div class="field-value">${gt.handoff ? 'Yes' : 'No'}</div></div>
        <div class="field"><div class="field-label">HITL</div><div class="field-value">${gt.hitl ? 'Yes' : 'No'}</div></div>
        <div class="field"><div class="field-label">Keywords</div><div class="field-value">${(gt.keywords || []).map(k => `<span class="tag">${escHtml(k)}</span>`).join('')}</div></div>
      </div>
      <div class="compare-col">
        <h4>Agent Actual</h4>
        <div class="field"><div class="field-label">Tools</div><div class="field-value">${agentToolTags}</div></div>
        <div class="field"><div class="field-label">Handoff</div><div class="field-value ${result.agent_handoff === gt.handoff ? 'match' : 'mismatch'}">${result.agent_handoff ? 'Yes' : 'No'} ${result.agent_handoff === gt.handoff ? '✓' : '✗'}</div></div>
        <div class="field"><div class="field-label">HITL</div><div class="field-value ${result.agent_hitl === gt.hitl ? 'match' : 'mismatch'}">${result.agent_hitl ? 'Yes' : 'No'} ${result.agent_hitl === gt.hitl ? '✓' : '✗'}</div></div>
        <div class="field"><div class="field-label">Latency</div><div class="field-value">${result.latency_s}s</div></div>
      </div>
    </div>`;
  }

  // Judge
  let judgeHtml = '';
  if (hasResult && result.judge_score > 0) {
    const raw = Math.round(result.judge_score * 4 + 1);
    const jr = (result.judge_reason || '').trim();
    const jrText = (!isPlaceholderJudgeReason(jr) ? jr : 'Judge output was placeholder/invalid. Please rerun this test with Judge enabled.');
    judgeHtml = `<div class="section"><h3>LLM Judge</h3>
      <div class="judge-box">
        <div class="judge-score">${raw}/5 (${pct(result.judge_score)})</div>
        <div class="judge-reason">${escHtml(jrText)}</div>
      </div></div>`;
  }

  // State diff
  const src = test.source_state.jobs;
  const tgt = test.target_state.jobs;
  const changed = Object.keys(src).filter(jid => tgt[jid] && src[jid].state !== tgt[jid].state);
  let stateHtml = '';
  if (changed.length > 0) {
    stateHtml = `<div class="section"><h3>Expected State Transition</h3>
      <div style="font-size:13px">${changed.map(jid =>
        `<span class="tag">${jid}: ${src[jid].state} → ${tgt[jid].state}</span>`
      ).join(' ')}</div></div>`;
  } else {
    stateHtml = `<div class="section"><h3>State Transition</h3>
      <div style="font-size:12px;color:var(--muted)">No state change expected (read-only)</div></div>`;
  }

  // Nav
  const idx = dataset.findIndex(t => t.id === test.id);
  const prevId = idx > 0 ? dataset[idx-1].id : null;
  const nextId = idx < dataset.length - 1 ? dataset[idx+1].id : null;

  dv.innerHTML = `
    <div class="detail">
      <h2>${test.id}</h2>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">
        ${test.category} · ${test.scenario} ${test.variant_of ? '(variant of ' + test.variant_of + ')' : ''}
      </div>
      <div class="prompt-text">${test.input}</div>

      ${hasResult ? `<div class="section"><h3>Scores</h3><div class="score-grid">${scoreCards}</div></div>` : ''}
      ${compareHtml ? `<div class="section"><h3>Ground Truth vs Agent</h3>${compareHtml}</div>` : ''}
      ${stateHtml}
      ${judgeHtml}
      ${hasResult ? `<div class="section"><h3>Agent Response</h3><div class="response-box">${escHtml(result.agent_response)}</div></div>` : ''}
      ${hasResult && result.error ? `<div class="section"><h3>Error</h3><div class="response-box" style="border-color:var(--red)">${escHtml(result.error)}</div></div>` : ''}

      <div style="margin-top:12px">
        <button class="btn sm" onclick="runSingle('${test.id}')">▶ Run this test</button>
      </div>

      <div class="nav-row">
        <button class="btn sm secondary" ${prevId ? `onclick="loadTestDetail('${prevId}')"` : 'disabled'}>← Prev</button>
        <span style="font-size:11px;color:var(--muted)">${idx + 1} / ${dataset.length}</span>
        <button class="btn sm secondary" ${nextId ? `onclick="loadTestDetail('${nextId}')"` : 'disabled'}>Next →</button>
      </div>
    </div>`;
}

function renderMetrics(metrics) {
  const mv = document.getElementById('metrics-view');
  mv.style.display = 'block';
  mv.innerHTML = `<div class="metrics-panel">
    <h3 style="margin-bottom:12px">Aggregate Metrics</h3>
    <div class="metrics-grid">
      ${metricCard('Pass Rate', metrics.pass_rate)}
      ${metricCard('BAR', metrics.BAR, 'Behavioral Agreement')}
      ${metricCard('SVR', metrics.SVR, 'Safety Violation', true)}
      ${metricCard('CSR', metrics.CSR, 'Cross-Scenario')}
      ${metricCard('Tool Recall', metrics.avg_tool_recall)}
      ${metricCard('Routing', metrics.avg_routing_match)}
      ${metricCard('HITL', metrics.avg_hitl_match)}
      ${metricCard('Overall', metrics.avg_overall)}
      ${metrics.avg_judge_score > 0 ? metricCard('Judge', metrics.avg_judge_score) : ''}
    </div>
  </div>`;
}

function metricCard(label, val, sub, invert) {
  const color = invert
    ? (val <= 0.05 ? 'var(--green)' : val > 0.2 ? 'var(--red)' : 'var(--yellow)')
    : (val >= 0.8 ? 'var(--green)' : val < 0.5 ? 'var(--red)' : 'var(--yellow)');
  return `<div class="metric">
    <div class="val" style="color:${color}">${pct(val)}</div>
    <div class="label">${label}${sub ? '<br><small>(' + sub + ')</small>' : ''}</div>
  </div>`;
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Keyboard nav ───────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (!activeTestId) return;
  const idx = dataset.findIndex(t => t.id === activeTestId);
  if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    if (idx < dataset.length - 1) loadTestDetail(dataset[idx+1].id);
  }
  if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    if (idx > 0) loadTestDetail(dataset[idx-1].id);
  }
});

// ── Init ───────────────────────────────────────────────────────────────────

(async function init() {
  await syncRuntimeConfig();
  const r = await fetch(`${API}/api/status`);
  const s = await r.json();
  if (s.dataset_loaded) {
    await refreshDataset();
    // Load existing results
    const rr = await fetch(`${API}/api/results`);
    const rd = await rr.json();
    for (const res of rd.results) results[res.test_id] = res;
    if (rd.metrics && rd.metrics.n_tests) renderMetrics(rd.metrics);
    renderTestList();
    updateStats();
  }
})();
</script>
</body>
</html>
